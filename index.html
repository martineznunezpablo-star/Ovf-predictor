<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVF Predictor v6.1 — Predictor Clínico de Fracturas Osteoporóticas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            /* MEDICAL BLUE PALETTE — Confianza y Calma */
            --bg:#F8FAFC;
            --surface:#FFFFFF;
            --surface-alt:#F1F5F9;
            --border:#E2E8F0;
            --border-strong:#CBD5E1;
            --text:#0F172A;
            --text-muted:#64748B;

            --primary:#2563EB;
            --primary-dark:#1E40AF;
            --primary-darker:#1E3A8A;
            --primary-light:#DBEAFE;
            --primary-lighter:#EFF6FF;

            /* TRAFFIC LIGHT — Visualización de Riesgo */
            --green:#16A34A;
            --green-dark:#15803D;
            --green-light:#DCFCE7;
            --green-bg:#F0FDF4;
            --yellow:#CA8A04;
            --yellow-dark:#A16207;
            --yellow-light:#FEF3C7;
            --yellow-bg:#FFFBEB;
            --red:#DC2626;
            --red-dark:#B91C1C;
            --red-light:#FEE2E2;
            --red-bg:#FEF2F2;

            --shadow-sm:0 1px 2px rgba(15,23,42,.04);
            --shadow-md:0 4px 12px rgba(15,23,42,.06);
            --shadow-lg:0 12px 32px rgba(15,23,42,.08);
            --shadow-xl:0 20px 48px rgba(15,23,42,.12);

            --radius:12px;
            --radius-lg:16px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

        /* ============== HEADER (azul médico) ============== */
        .header{background:linear-gradient(135deg,var(--primary-darker) 0%,var(--primary-dark) 50%,var(--primary) 100%);padding:2rem 1.5rem 2.2rem;color:#fff;position:relative;overflow:hidden}
        .header::before{content:'';position:absolute;top:-30%;right:-15%;width:55%;height:160%;background:radial-gradient(ellipse,rgba(255,255,255,.08),transparent 70%);pointer-events:none}
        .header::after{content:'';position:absolute;bottom:-50%;left:-10%;width:40%;height:120%;background:radial-gradient(ellipse,rgba(255,255,255,.04),transparent 70%);pointer-events:none}
        .header-inner{max-width:1100px;margin:0 auto;position:relative}
        .header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.1rem;flex-wrap:wrap;gap:.8rem}
        .header-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:.35rem .85rem;border-radius:100px;backdrop-filter:blur(10px)}
        .header-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#86EFAC;box-shadow:0 0 8px #86EFAC}
        .header h1{font-family:'Inter',sans-serif;font-size:clamp(1.5rem,3.4vw,2.15rem);font-weight:700;line-height:1.18;margin-bottom:.55rem;letter-spacing:-.02em}
        .header p{font-size:.92rem;opacity:.85;max-width:640px;font-weight:400}
        .header-stats{display:flex;gap:2.2rem;margin-top:1.4rem;flex-wrap:wrap}
        .header-stat{font-size:.72rem;opacity:.75;font-weight:500;letter-spacing:.02em}
        .header-stat strong{font-size:1.15rem;display:block;opacity:1;font-weight:700;letter-spacing:-.01em}

        .lang-switch{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:100px;overflow:hidden;flex-shrink:0;backdrop-filter:blur(10px)}
        .lang-btn{padding:.4rem .9rem;font-family:inherit;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:none;cursor:pointer;transition:all .25s;color:rgba(255,255,255,.65);background:transparent}
        .lang-btn.active{background:rgba(255,255,255,.22);color:#fff}
        .lang-btn:hover:not(.active){color:rgba(255,255,255,.9)}

        /* ============== MAIN ============== */
        .main{max-width:1100px;margin:0 auto;padding:1.6rem 1.5rem 2rem}

        .disclaimer{background:var(--yellow-bg);border:1px solid #FDE68A;border-radius:var(--radius);padding:.95rem 1.15rem;margin-bottom:1.6rem;font-size:.82rem;color:#854D0E;display:flex;gap:.7rem;align-items:flex-start}
        .disclaimer-icon{flex-shrink:0;font-size:1.05rem;line-height:1.4}

        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem;margin-bottom:1.6rem}
        @media(max-width:760px){.form-grid{grid-template-columns:1fr}}

        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.4rem;box-shadow:var(--shadow-sm)}
        .card-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-dark);margin-bottom:1.1rem;padding-bottom:.55rem;border-bottom:2px solid var(--primary-lighter);display:flex;align-items:center;gap:.45rem}

        .field{margin-bottom:1rem}
        .field:last-child{margin-bottom:0}
        .label-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem}
        .field label{font-size:.83rem;font-weight:600;color:var(--text)}
        .field .hint{font-size:.72rem;color:var(--text-muted);margin-bottom:.25rem;font-weight:400}

        /* INFO (i) BUTTONS — heurística */
        .info-btn{width:18px;height:18px;border-radius:50%;background:var(--primary-lighter);color:var(--primary);border:1.5px solid var(--primary-light);font-size:.7rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-style:italic;font-family:'Georgia',serif;transition:all .2s;flex-shrink:0;padding:0;line-height:1}
        .info-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.1)}
        .info-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

        /* TOOLTIP popups */
        .tooltip-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:99;display:none;backdrop-filter:blur(2px)}
        .tooltip-overlay.show{display:block;animation:fadeIn .2s ease}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .tooltip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem 1.3rem;max-width:380px;width:calc(100% - 2rem);box-shadow:var(--shadow-xl);z-index:100;display:none}
        .tooltip.show{display:block;animation:popIn .25s cubic-bezier(.4,0,.2,1)}
        @keyframes popIn{from{opacity:0;transform:translate(-50%,-45%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
        .tooltip-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
        .tooltip-title{font-size:.92rem;font-weight:700;color:var(--primary-dark)}
        .tooltip-close{width:24px;height:24px;border-radius:50%;background:var(--surface-alt);border:none;cursor:pointer;font-size:1rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;transition:all .15s}
        .tooltip-close:hover{background:var(--border);color:var(--text)}
        .tooltip-body{font-size:.83rem;color:var(--text);line-height:1.55}
        .tooltip-body strong{color:var(--primary-dark);font-weight:600}

        /* INPUTS */
        .input-row{display:flex;align-items:center;gap:.7rem}
        input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;background:var(--surface-alt);border-radius:3px;outline:none;cursor:pointer}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(37,99,235,.35);border:2px solid #fff}
        input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(37,99,235,.35);border:2px solid #fff}
        .range-value{min-width:3rem;text-align:center;font-weight:700;font-size:.95rem;color:var(--primary-dark);background:var(--primary-lighter);padding:.3rem .55rem;border-radius:8px;border:1px solid var(--primary-light)}
        select{width:100%;padding:.55rem .8rem;border:1px solid var(--border-strong);border-radius:8px;font-family:inherit;font-size:.85rem;background:var(--surface);color:var(--text);cursor:pointer;font-weight:500;transition:all .15s}
        select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
        select:hover{border-color:var(--primary)}

        /* TOGGLE */
        .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.4rem 0;gap:.6rem}
        .toggle-label-wrap{display:flex;align-items:center;gap:.4rem;flex:1}
        .toggle-label{font-size:.83rem;font-weight:600}
        .toggle{position:relative;width:44px;height:24px;flex-shrink:0}
        .toggle input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border-strong);border-radius:24px;transition:.3s}
        .toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
        .toggle input:checked+.toggle-slider{background:var(--primary)}
        .toggle input:checked+.toggle-slider::before{transform:translateX(20px)}

        /* PREDICT BUTTON */
        .predict-btn{width:100%;padding:1.05rem;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border:none;border-radius:var(--radius);font-family:inherit;font-size:1.02rem;font-weight:700;cursor:pointer;transition:all .25s;box-shadow:0 4px 14px rgba(37,99,235,.25);letter-spacing:.01em}
        .predict-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(37,99,235,.32)}
        .predict-btn:active{transform:translateY(0)}

        /* ============== RESULTS ============== */
        .results{margin-top:1.8rem;animation:fadeUp .5s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

        /* COMPARISON SECTION — ahora es el bloque principal del resultado */
        .comparison-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.6rem;box-shadow:var(--shadow-sm);margin-bottom:1.2rem}
        .comparison-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-dark);margin-bottom:1.3rem;padding-bottom:.55rem;border-bottom:2px solid var(--primary-lighter)}
        .comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
        @media(max-width:540px){.comparison-grid{grid-template-columns:1fr;gap:1rem}}
        /* Ambos paneles con el mismo peso visual — el modelo predice, no recomienda */
        .comparison-panel{padding:1.4rem 1rem 1.2rem;border-radius:var(--radius);background:var(--surface-alt);border:2px solid var(--border);text-align:center;transition:border-color .3s,background .3s;position:relative}
        .comparison-panel.green{border-color:var(--green);background:var(--green-light)}
        .comparison-panel.yellow{border-color:var(--yellow);background:var(--yellow-light)}
        .comparison-panel.red{border-color:var(--red);background:var(--red-light)}
        .comparison-panel-label{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.9rem}
        .prob-ring{position:relative;width:140px;height:140px;margin:0 auto .8rem}
        @media(max-width:540px){.prob-ring{width:120px;height:120px}}
        .prob-ring svg{transform:rotate(-90deg)}
        .prob-ring-bg{fill:none;stroke:rgba(15,23,42,.06);stroke-width:9}
        .prob-ring-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s ease,stroke .3s ease}
        .prob-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .prob-value{font-size:2.2rem;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
        @media(max-width:540px){.prob-value{font-size:1.9rem}}
        .prob-label{font-size:.68rem;color:var(--text-muted);margin-top:.2rem;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
        .panel-risk-badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.3rem .7rem;border-radius:100px;margin-top:.3rem}
        .panel-risk-badge.green{background:var(--green);color:#fff}
        .panel-risk-badge.yellow{background:var(--yellow);color:#fff}
        .panel-risk-badge.red{background:var(--red);color:#fff}
        .panel-risk-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85}

        /* Diferencial entre escenarios — descriptivo, secundario, sin recomendación */
        .scenario-differential{margin-top:1.3rem;padding:.85rem 1rem;background:var(--surface-alt);border-radius:var(--radius);border-left:3px solid var(--primary-light);font-size:.78rem;color:var(--text);line-height:1.5}
        .scenario-differential .diff-label{color:var(--text-muted);font-weight:500}
        .scenario-differential .diff-value{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}

        /* FACTORS */
        .factors-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.4rem;box-shadow:var(--shadow-sm);margin-bottom:1.2rem}
        .factors-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--primary-dark);margin-bottom:.7rem;padding-bottom:.55rem;border-bottom:2px solid var(--primary-lighter)}
        .factors-subtitle{font-size:.75rem;color:var(--text-muted);margin-bottom:1rem}
        .factor-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;font-size:.78rem}
        .factor-name{width:140px;flex-shrink:0;text-align:right;color:var(--text);font-size:.76rem;font-weight:500}
        @media(max-width:540px){.factor-name{width:100px;font-size:.7rem}}
        .factor-bar-container{flex:1;height:18px;position:relative;background:var(--surface-alt);border-radius:4px}
        .factor-bar-center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border-strong);z-index:1}
        .factor-bar{position:absolute;height:14px;top:2px;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}
        .factor-bar.positive{left:50%;background:linear-gradient(90deg,#FCA5A5,var(--red))}
        .factor-bar.negative{right:50%;background:linear-gradient(270deg,#86EFAC,var(--green))}
        .factor-impact{width:52px;text-align:right;font-weight:700;font-size:.74rem;font-variant-numeric:tabular-nums}
        .factor-impact.pos{color:var(--red-dark)}
        .factor-impact.neg{color:var(--green-dark)}

        /* MODEL CONFIDENCE — visualización del AUC */
        .model-confidence{background:linear-gradient(135deg,var(--primary-lighter),#F0F9FF);border:1px solid var(--primary-light);border-radius:var(--radius-lg);padding:1.2rem 1.3rem;margin-bottom:1.2rem}
        .mc-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem}
        .mc-icon{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
        .mc-title{font-size:.85rem;font-weight:700;color:var(--primary-darker)}
        .mc-text{font-size:.78rem;color:#1E3A8A;line-height:1.55;margin-bottom:.9rem}
        .mc-text strong{font-weight:600}
        .mc-bar-wrap{position:relative}
        .mc-bar{height:8px;border-radius:100px;background:linear-gradient(90deg,#FCA5A5 0%,#FCD34D 30%,#86EFAC 60%,var(--green) 100%);position:relative}
        .mc-marker{position:absolute;top:-3px;width:4px;height:14px;background:var(--primary-darker);border-radius:2px;box-shadow:0 0 0 2px #fff;transform:translateX(-50%)}
        .mc-scale{display:flex;justify-content:space-between;font-size:.62rem;color:var(--primary-darker);margin-top:.4rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.7}

        /* FOOTER */
        .footer{margin-top:2rem;padding:1.4rem;text-align:center;font-size:.74rem;color:var(--text-muted);border-top:1px solid var(--border)}
        .footer-model{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border);padding:.35rem .85rem;border-radius:100px;margin-top:.6rem;font-size:.7rem;font-weight:500}
        .footer-model::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary)}
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header"><div class="header-inner">
    <div class="header-top">
        <div class="header-badge" data-i18n="header_badge"></div>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('es')" id="btn-es">ES</button>
            <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
        </div>
    </div>
    <h1 data-i18n-html="header_title"></h1>
    <p data-i18n="header_subtitle"></p>
    <div class="header-stats">
        <div class="header-stat"><strong>482</strong> <span data-i18n="patients"></span></div>
        <div class="header-stat"><strong>0.744</strong> AUC-ROC</div>
        <div class="header-stat"><strong>9</strong> <span data-i18n="variables"></span></div>
        <div class="header-stat"><strong data-i18n="isotonic_word"></strong> <span data-i18n="calibration"></span></div>
    </div>
</div></div>

<div class="main">
    <div class="disclaimer">
        <span class="disclaimer-icon">&#9888;&#65039;</span>
        <div data-i18n-html="disclaimer"></div>
    </div>

    <!-- FORM -->
    <div class="form-grid">
        <!-- PACIENTE -->
        <div class="card">
            <div class="card-title" data-i18n-html="card_patient"></div>

            <div class="field">
                <div class="label-row">
                    <label data-i18n="lbl_age"></label>
                    <button class="info-btn" onclick="showInfo('age')" aria-label="Info">i</button>
                </div>
                <div class="input-row">
                    <input type="range" id="age" min="50" max="96" value="76" oninput="uv('age')">
                    <span class="range-value" id="age-val">76</span>
                </div>
            </div>

            <div class="field">
                <div class="label-row">
                    <label>IMC (kg/m&sup2;)</label>
                    <button class="info-btn" onclick="showInfo('imc')" aria-label="Info">i</button>
                </div>
                <div class="input-row">
                    <input type="range" id="imc" min="15" max="45" value="26" step="0.5" oninput="uv('imc')">
                    <span class="range-value" id="imc-val">26</span>
                </div>
            </div>

            <div class="field">
                <div class="label-row">
                    <label data-i18n="lbl_mfi"></label>
                    <button class="info-btn" onclick="showInfo('mfi')" aria-label="Info">i</button>
                </div>
                <select id="mfi" data-i18n-opts="opts_mfi"></select>
            </div>

            <div class="field">
                <div class="label-row">
                    <label>Health Status</label>
                    <button class="info-btn" onclick="showInfo('hs')" aria-label="Info">i</button>
                </div>
                <div class="hint" data-i18n="hint_hs"></div>
                <select id="hs" data-i18n-opts="opts_hs"></select>
            </div>
        </div>

        <!-- FRACTURA -->
        <div class="card">
            <div class="card-title" data-i18n-html="card_fracture"></div>

            <div class="field">
                <div class="label-row">
                    <label data-i18n="lbl_gs"></label>
                    <button class="info-btn" onclick="showInfo('gs')" aria-label="Info">i</button>
                </div>
                <select id="gs" data-i18n-opts="opts_gs"></select>
            </div>

            <div class="field">
                <div class="label-row">
                    <label data-i18n="lbl_uh"></label>
                    <button class="info-btn" onclick="showInfo('uh')" aria-label="Info">i</button>
                </div>
                <div class="hint" data-i18n="hint_uh"></div>
                <div class="input-row">
                    <input type="range" id="uh" min="4" max="194" value="78" oninput="uv('uh')">
                    <span class="range-value" id="uh-val">78</span>
                </div>
            </div>

            <div class="field">
                <div class="label-row">
                    <label data-i18n="lbl_mech"></label>
                    <button class="info-btn" onclick="showInfo('mech')" aria-label="Info">i</button>
                </div>
                <select id="mech" data-i18n-opts="opts_mech"></select>
            </div>

            <div class="field">
                <div class="toggle-row">
                    <div class="toggle-label-wrap">
                        <span class="toggle-label" data-i18n="lbl_defprog"></span>
                        <button class="info-btn" onclick="showInfo('defprog')" aria-label="Info">i</button>
                    </div>
                    <label class="toggle"><input type="checkbox" id="defprog"><span class="toggle-slider"></span></label>
                </div>
            </div>

            <div style="margin-top:1.2rem;padding-top:.8rem;border-top:1px solid var(--border)">
                <div class="card-title" style="border:none;padding:0;margin-bottom:.4rem" data-i18n-html="card_treatment"></div>
                <div class="hint" data-i18n="hint_treatment"></div>
            </div>
        </div>
    </div>

    <button class="predict-btn" onclick="predict()" data-i18n="btn_predict"></button>

    <!-- RESULTS -->
    <div id="results" class="results" style="display:none">

        <!-- COMPARISON SECTION — bloque principal, simétrico, descriptivo -->
        <div class="comparison-section">
            <div class="comparison-title" data-i18n="comparison_title"></div>
            <div class="comparison-grid">
                <div class="comparison-panel" id="panel-c">
                    <div class="comparison-panel-label" data-i18n="res_no_cement"></div>
                    <div class="prob-ring">
                        <svg viewBox="0 0 120 120">
                            <circle class="prob-ring-bg" cx="60" cy="60" r="52"/>
                            <circle id="ring-c" class="prob-ring-fill" cx="60" cy="60" r="52" stroke="#94A3B8" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
                        </svg>
                        <div class="prob-ring-text">
                            <span class="prob-value" id="prob-c">&mdash;</span>

// ===================================================================
// MODEL v5.1: CalibratedClassifierCV (5-fold ensemble)
//   = LogisticRegression(C=0.1) + sigmoid (Platt) calibration
// Trained on 385 patients, validated on 97 (test) + 74 (external)
// 9 Features: EDAD, VA, MECANISMO_No_trauma, HEALTH STATUS,
//   PROGRESION DEFORMIDAD, IMC, mFI, MORFOLOGIA FRACTURA, UH
// Predicts P(POOR) by averaging the 5 calibrated base classifiers
// (reproduces exactly the output of the Python TFM model).
// AUC: 0.667 (CV interna, n=482) · 0.744 (val. ext., n=74)
// Brier: 0.227 (CV interna) → 0.211 (val. ext.)
// ECE: 0.162 (LR sin calibrar) → 0.096 (LR + Platt, CV 5-fold)
// ===================================================================
const M = {
    // StandardScaler (n=385) — global, compartido por los 5 folds
    mean: [75.662338, 0.119481, 0.249351, -0.25974, 0.05974, 25.964196, 0.927273, 2.864935, 78.043662],
    std:  [9.480548, 0.324353, 0.432637, 0.514784, 0.237005, 3.654726, 0.766106, 0.887103, 25.960797],

    // 5 modelos base + 5 calibradores Platt (CalibratedClassifierCV cv=5).
    // En predictProba se promedian las 5 probabilidades calibradas,
    // reproduciendo exactamente el output del modelo Python del TFM.
    // Fórmula: P_calibrada = sigmoid(platt_a * logit + platt_b)
    folds: [
        {intercept: 0.227302, coef: [0.16855, -0.474422, 0.186119, -0.372371, 0.126879, 0.131837, -0.152523, 0.169013, -0.130985], platt_a: 0.492278, platt_b: -0.068627},
        {intercept: 0.170599, coef: [0.309829, -0.45471, 0.107277, -0.228979, 0.124517, 0.056653, -0.174748, 0.223079, -0.050067], platt_a: 0.735636, platt_b: 0.029536},
        {intercept: 0.162175, coef: [0.149581, -0.351754, 0.161983, -0.121016, 0.245352, 0.093716, 0.060702, 0.180333, -0.177586], platt_a: 0.810371, platt_b: 0.091535},
        {intercept: 0.170926, coef: [0.289341, -0.441031, 0.107324, -0.249306, 0.155979, 0.064847, -0.194437, 0.233309, -0.137601], platt_a: 0.529031, platt_b: 0.092148},
        {intercept: 0.146555, coef: [0.169061, -0.421083, 0.116659, -0.169874, 0.073259, 0.174611, -0.109428, 0.212389, 0.002575], platt_a: 1.725474, platt_b: 0.015442}
    ],

    // Coeficientes promedio para SHAP (TFM: SHAP independiente sobre cada
    // modelo base, después promediado → equivale a coef_avg sobre z-scores).
    intercept_avg: 0.175512,
    coef_avg: [0.217273, -0.4286, 0.135872, -0.228309, 0.145197, 0.104333, -0.114087, 0.203624, -0.098733]
};

function sigmoid(x){return 1/(1+Math.exp(-x))}

function predictProba(raw){
    const sc = raw.map((v,i) => (v-M.mean[i])/M.std[i]);
    // Promediar las 5 probabilidades calibradas (CalibratedClassifierCV cv=5)
    let sum = 0;
    for (const f of M.folds) {
        const logit = f.intercept + sc.reduce((s,v,i)=>s+f.coef[i]*v, 0);
        sum += sigmoid(f.platt_a*logit + f.platt_b);
    }
    return sum / M.folds.length;  // P(POOR) calibrada
}

function getContributions(raw){
    // SHAP-like contribution toward P(POOR) en log-odds:
    // promedio de los 5 modelos base = coef_avg sobre z-scores.
    // positive value = pushes toward unfavorable outcome (harmful)
    // negative value = pushes toward favorable outcome (protective)
    return raw.map((v,i)=>({
        name: I[LANG].factor_labels[i],
        c: M.coef_avg[i]*((v-M.mean[i])/M.std[i])
    }));
}

function getRaw(va){
    return [
        +document.getElementById('age').value,
        va,
        +document.getElementById('mech').value,
        +document.getElementById('hs').value,
        document.getElementById('defprog').checked?1:0,
        +document.getElementById('imc').value,
        +document.getElementById('mfi').value,
        +document.getElementById('gs').value,
        +document.getElementById('uh').value
    ];
}

function uv(id){document.getElementById(id+'-val').textContent=document.getElementById(id).value}
function setRing(id,p,colorClass){
    const el=document.getElementById(id);
    el.style.strokeDashoffset=326.73*(1-p);
    if(colorClass==='green')el.style.stroke='var(--green)';
    else if(colorClass==='yellow')el.style.stroke='var(--yellow)';
    else if(colorClass==='red')el.style.stroke='var(--red)';
}

// TRAFFIC LIGHT THRESHOLDS — p is now P(unfavorable outcome)
// p ≥ 0.60 → red (high risk)
// 0.40 ≤ p < 0.60 → yellow (uncertain)
// p < 0.40 → green (low risk)
function getRiskClass(p){
    if(p>=0.60)return 'red';
    if(p>=0.40)return 'yellow';
    return 'green';
}

function predict(){
    const t=I[LANG];
    const pC=predictProba(getRaw(0));   // P(unfavorable | conservative)
    const pS=predictProba(getRaw(1));   // P(unfavorable | cementation)
    const benefit=pC-pS;                 // positive = cementation lowers predicted risk
    const bp=(Math.abs(benefit)*100).toFixed(1);

    document.getElementById('results').style.display='block';

    // ============== SYMMETRIC COMPARISON PANELS ==============
    // Both panels are equal weight: tool predicts, doesn't recommend.
    const rcClass=getRiskClass(pC);
    const rsClass=getRiskClass(pS);

    // Panel CONSERVATIVE
    document.getElementById('prob-c').textContent=(pC*100).toFixed(1)+'%';
    document.getElementById('prob-c').style.color=
        rcClass==='green'?'var(--green-dark)':rcClass==='yellow'?'var(--yellow-dark)':'var(--red-dark)';
    document.getElementById('panel-c').className='comparison-panel '+rcClass;
    const badgeC=document.getElementById('badge-c');
    badgeC.className='panel-risk-badge '+rcClass;
    badgeC.textContent=rcClass==='green'?t.risk_badge_low:(rcClass==='yellow'?t.risk_badge_mod:t.risk_badge_high);

    // Panel SURGICAL
    document.getElementById('prob-s').textContent=(pS*100).toFixed(1)+'%';
    document.getElementById('prob-s').style.color=
        rsClass==='green'?'var(--green-dark)':rsClass==='yellow'?'var(--yellow-dark)':'var(--red-dark)';
    document.getElementById('panel-s').className='comparison-panel '+rsClass;
    const badgeS=document.getElementById('badge-s');
    badgeS.className='panel-risk-badge '+rsClass;
    badgeS.textContent=rsClass==='green'?t.risk_badge_low:(rsClass==='yellow'?t.risk_badge_mod:t.risk_badge_high);

    setTimeout(()=>{
        setRing('ring-c',pC,rcClass);
        setRing('ring-s',pS,rsClass);
    },100);

    // ============== DIFFERENTIAL (descriptive, no recommendation) ==============
    let diffText;
    if(benefit>0.10){diffText=t.diff_high;}
    else if(benefit>0.03){diffText=t.diff_mod;}
    else {diffText=t.diff_low;}
    document.getElementById('diff-value').textContent=diffText.replace('{bp}',bp);

    // ============== FACTOR CONTRIBUTIONS ==============
    // Computed on the CONSERVATIVE scenario (VA=0) so the bars represent
    // the patient's intrinsic risk profile. The effect of VA is fully
    // captured in the comparison panel above.
    const cs=getContributions(getRaw(0));
    cs.sort((a,b)=>Math.abs(b.c)-Math.abs(a.c));
    const mx=Math.max(...cs.map(c=>Math.abs(c.c)));
    const fc=document.getElementById('fc');
    fc.innerHTML='';

    cs.forEach(c=>{
        const pct=(Math.abs(c.c)/mx)*42;
        const pos=c.c>=0;
        fc.innerHTML+='<div class="factor-row">'+
            '<span class="factor-name">'+c.name+'</span>'+
            '<div class="factor-bar-container"><div class="factor-bar-center"></div>'+
            '<div class="factor-bar '+(pos?'positive':'negative')+'" style="width:'+pct+'%"></div></div>'+
            '<span class="factor-impact '+(pos?'pos':'neg')+'">'+(pos?'+':'')+c.c.toFixed(3)+'</span></div>';
    });

    document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

// Initialize
setLang('es');
</script>
