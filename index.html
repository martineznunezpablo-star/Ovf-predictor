<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVF Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#F7F5F0;--surface:#FFF;--surface-alt:#EDE9E1;--border:#D4CFC5;--text:#1A1A1A;--text-muted:#6B6560;--accent:#1B6B4A;--accent-light:#E8F3ED;--accent-dark:#0F4A32;--danger:#B8352A;--danger-light:#FDF0EF;--warning-light:#FFF8ED;--blue:#2563EB;--blue-light:#EFF6FF;--radius:12px;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 12px 40px rgba(0,0,0,.1)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}

        /* HEADER */
        .header{background:linear-gradient(135deg,#0F2B1D,#1B4A35 50%,#1B6B4A);padding:2rem 1.5rem;color:#fff;position:relative;overflow:hidden}
        .header::before{content:'';position:absolute;top:-50%;right:-20%;width:60%;height:200%;background:radial-gradient(ellipse,rgba(255,255,255,.04),transparent 70%);pointer-events:none}
        .header-inner{max-width:1000px;margin:0 auto;position:relative}
        .header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;flex-wrap:wrap;gap:.8rem}
        .header-badge{display:inline-block;font-size:.65rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:.3rem .8rem;border-radius:100px}
        .header h1{font-family:'DM Serif Display',serif;font-size:clamp(1.5rem,3.5vw,2.1rem);font-weight:400;line-height:1.2;margin-bottom:.5rem}
        .header p{font-size:.88rem;opacity:.75;max-width:600px}
        .header-stats{display:flex;gap:2rem;margin-top:1rem;flex-wrap:wrap}
        .header-stat{font-size:.73rem;opacity:.7}
        .header-stat strong{font-size:1.05rem;display:block;opacity:1;font-weight:600}

        /* LANGUAGE SWITCHER */
        .lang-switch{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:100px;overflow:hidden;flex-shrink:0}
        .lang-btn{padding:.35rem .85rem;font-family:inherit;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:none;cursor:pointer;transition:all .25s;color:rgba(255,255,255,.6);background:transparent}
        .lang-btn.active{background:rgba(255,255,255,.2);color:#fff}
        .lang-btn:hover:not(.active){color:rgba(255,255,255,.85)}

        /* MAIN */
        .main{max-width:1000px;margin:0 auto;padding:1.5rem}
        .disclaimer{background:var(--warning-light);border:1px solid #E8D5A8;border-radius:var(--radius);padding:.9rem 1.1rem;margin-bottom:1.5rem;font-size:.78rem;color:#7A5A0A;display:flex;gap:.6rem;align-items:flex-start}

        /* GRID */
        .form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2rem;margin-bottom:1.5rem}
        @media(max-width:900px){.form-grid{grid-template-columns:1fr 1fr}}
        @media(max-width:600px){.form-grid{grid-template-columns:1fr}}

        /* CARDS */
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;box-shadow:var(--shadow-sm)}
        .card-title{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}

        /* FIELDS */
        .field{margin-bottom:.9rem}.field:last-child{margin-bottom:0}
        .field label{display:block;font-size:.8rem;font-weight:500;margin-bottom:.25rem}
        .field .hint{font-size:.7rem;color:var(--text-muted);margin-bottom:.2rem}
        .input-row{display:flex;align-items:center;gap:.7rem}
        input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:5px;background:var(--surface-alt);border-radius:3px;outline:none}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
        .range-value{min-width:2.8rem;text-align:center;font-weight:600;font-size:.95rem;color:var(--accent-dark);background:var(--accent-light);padding:.2rem .4rem;border-radius:6px}
        select{width:100%;padding:.5rem .7rem;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.82rem;background:var(--surface);color:var(--text);cursor:pointer}
        select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,107,74,.1)}

        /* TOGGLES */
        .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:.35rem 0}
        .toggle-label{font-size:.8rem;font-weight:500}
        .toggle{position:relative;width:44px;height:24px}.toggle input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:24px;transition:.3s}
        .toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
        .toggle input:checked+.toggle-slider{background:var(--accent)}
        .toggle input:checked+.toggle-slider::before{transform:translateX(20px)}

        /* BUTTON */
        .predict-btn{width:100%;padding:.9rem;background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff;border:none;border-radius:var(--radius);font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-md)}
        .predict-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}

        /* RESULTS */
        .results{margin-top:1.5rem;animation:fadeUp .5s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .result-comparison{display:grid;grid-template-columns:1fr auto 1fr;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-md)}
        @media(max-width:600px){.result-comparison{grid-template-columns:1fr}.result-divider{display:none}}
        .result-panel{padding:1.3rem;text-align:center}
        .result-panel-title{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.7rem}
        .prob-ring{position:relative;width:120px;height:120px;margin:0 auto .8rem}
        .prob-ring svg{transform:rotate(-90deg)}
        .prob-ring-bg{fill:none;stroke:var(--surface-alt);stroke-width:8}
        .prob-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
        .prob-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .prob-value{font-family:'DM Serif Display',serif;font-size:1.9rem;line-height:1}
        .prob-label{font-size:.68rem;color:var(--text-muted);margin-top:.15rem}
        .result-divider{width:1px;background:var(--border)}

        /* BENEFIT */
        .benefit-card{margin-top:1rem;padding:1.1rem;border-radius:var(--radius);text-align:center}
        .benefit-card.positive{background:var(--accent-light);border:1px solid #B7D9C7}
        .benefit-card.negative{background:var(--danger-light);border:1px solid #E8C5C2}
        .benefit-card.neutral{background:var(--blue-light);border:1px solid #C5D5F0}
        .benefit-value{font-family:'DM Serif Display',serif;font-size:1.7rem;line-height:1;margin-bottom:.3rem}
        .benefit-card.positive .benefit-value{color:var(--accent-dark)}
        .benefit-card.negative .benefit-value{color:var(--danger)}
        .benefit-card.neutral .benefit-value{color:var(--blue)}
        .benefit-text{font-size:.8rem;color:var(--text-muted)}
        .benefit-recommendation{margin-top:.7rem;padding-top:.7rem;border-top:1px solid rgba(0,0,0,.08);font-size:.83rem;font-weight:600}

        /* FACTORS */
        .factors-card{margin-top:1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;box-shadow:var(--shadow-sm)}
        .factor-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;font-size:.78rem}
        .factor-name{width:150px;flex-shrink:0;text-align:right;color:var(--text-muted);font-size:.74rem}
        .factor-bar-container{flex:1;height:16px;position:relative}
        .factor-bar-center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)}
        .factor-bar{position:absolute;height:12px;border-radius:3px;transition:width .6s ease}
        .factor-bar.positive{left:50%;background:linear-gradient(90deg,#4CAF50,#2E7D32)}
        .factor-bar.negative{right:50%;background:linear-gradient(270deg,#EF5350,#C62828)}
        .factor-impact{width:48px;text-align:right;font-weight:600;font-size:.72rem}
        .factor-impact.pos{color:var(--accent)}.factor-impact.neg{color:var(--danger)}

        /* FOOTER */
        .footer{margin-top:2rem;padding:1.2rem;text-align:center;font-size:.72rem;color:var(--text-muted);border-top:1px solid var(--border)}
        .footer-model{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface-alt);padding:.25rem .7rem;border-radius:100px;margin-top:.5rem;font-size:.68rem}
    </style>
</head>
<body>

<div class="header"><div class="header-inner">
    <div class="header-top">
        <div class="header-badge" data-i18n="header_badge"></div>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLang('es')" id="btn-es">ES</button>
            <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
        </div>
    </div>
    <h1 data-i18n-html="header_title"></h1>
    <p data-i18n="header_subtitle"></p>
    <div class="header-stats">
        <div class="header-stat"><strong>482</strong> <span data-i18n="patients"></span></div>
        <div class="header-stat"><strong>0.655</strong> AUC (10-fold CV)</div>
        <div class="header-stat"><strong>18</strong> <span data-i18n="variables"></span></div>
    </div>
</div></div>

<div class="main">
    <div class="disclaimer">
        <span style="font-size:1rem;flex-shrink:0">&#9888;&#65039;</span>
        <div data-i18n-html="disclaimer"></div>
    </div>

    <div class="form-grid">
        <!-- PACIENTE -->
        <div class="card">
            <div class="card-title" data-i18n-html="card_patient"></div>
            <div class="field">
                <label data-i18n="lbl_age"></label>
                <div class="input-row">
                    <input type="range" id="age" min="50" max="96" value="76" oninput="uv('age')">
                    <span class="range-value" id="age-val">76</span>
                </div>
            </div>
            <div class="field">
                <label data-i18n="lbl_sex"></label>
                <select id="sex" data-i18n-opts="opts_sex"></select>
            </div>
            <div class="field">
                <label>IMC (kg/m&sup2;)</label>
                <div class="input-row">
                    <input type="range" id="imc" min="15" max="45" value="27" step="0.5" oninput="uv('imc')">
                    <span class="range-value" id="imc-val">27</span>
                </div>
            </div>
            <div class="field">
                <label data-i18n="lbl_asa"></label>
                <select id="asa" data-i18n-opts="opts_asa"></select>
            </div>
            <div class="field">
                <label data-i18n="lbl_mfi"></label>
                <select id="mfi" data-i18n-opts="opts_mfi"></select>
            </div>
            <div class="field">
                <label data-i18n="lbl_preindep"></label>
                <select id="preindep" data-i18n-opts="opts_preindep"></select>
            </div>
        </div>

        <!-- FRACTURA -->
        <div class="card">
            <div class="card-title" data-i18n-html="card_fracture"></div>
            <div class="field">
                <label data-i18n="lbl_gs"></label>
                <select id="gs" data-i18n-opts="opts_gs"></select>
            </div>
            <div class="field">
                <label data-i18n="lbl_uh"></label>
                <div class="hint" data-i18n="hint_uh"></div>
                <div class="input-row">
                    <input type="range" id="uh" min="4" max="194" value="78" oninput="uv('uh')">
                    <span class="range-value" id="uh-val">78</span>
                </div>
            </div>
            <div class="field">
                <label data-i18n="lbl_calcio"></label>
                <div class="input-row">
                    <input type="range" id="calcio" min="6" max="12" value="9.1" step="0.1" oninput="uv('calcio')">
                    <span class="range-value" id="calcio-val">9.1</span>
                </div>
            </div>
            <div class="field">
                <label data-i18n="lbl_mech"></label>
                <select id="mech" data-i18n-opts="opts_mech"></select>
            </div>
            <div class="field">
                <label data-i18n="lbl_seg"></label>
                <select id="seg" data-i18n-opts="opts_seg"></select>
            </div>
            <div class="field">
                <div class="toggle-row">
                    <span class="toggle-label" data-i18n="lbl_mult"></span>
                    <label class="toggle"><input type="checkbox" id="mult"><span class="toggle-slider"></span></label>
                </div>
            </div>
        </div>

        <!-- ANTECEDENTES -->
        <div class="card">
            <div class="card-title" data-i18n-html="card_history"></div>
            <div class="field">
                <div class="toggle-row">
                    <span class="toggle-label" data-i18n="lbl_op"></span>
                    <label class="toggle"><input type="checkbox" id="op"><span class="toggle-slider"></span></label>
                </div>
            </div>
            <div class="field">
                <div class="toggle-row">
                    <span class="toggle-label" data-i18n="lbl_tto_op"></span>
                    <label class="toggle"><input type="checkbox" id="tto_op"><span class="toggle-slider"></span></label>
                </div>
            </div>
            <div class="field">
                <div class="toggle-row">
                    <span class="toggle-label" data-i18n="lbl_aco"></span>
                    <label class="toggle"><input type="checkbox" id="aco"><span class="toggle-slider"></span></label>
                </div>
            </div>
            <div class="field">
                <label data-i18n="lbl_resi"></label>
                <select id="resi" data-i18n-opts="opts_resi"></select>
            </div>
            <div style="margin-top:1.2rem;padding-top:.8rem;border-top:1px solid var(--border)">
                <div class="card-title" style="border:none;padding:0;margin-bottom:.4rem" data-i18n-html="card_treatment"></div>
                <div class="hint" data-i18n="hint_treatment"></div>
            </div>
        </div>
    </div>

    <button class="predict-btn" onclick="predict()" data-i18n="btn_predict"></button>

    <!-- RESULTS -->
    <div id="results" class="results" style="display:none">
        <div class="result-comparison">
            <div class="result-panel">
                <div class="result-panel-title" data-i18n="res_no_cement"></div>
                <div class="prob-ring">
                    <svg viewBox="0 0 120 120">
                        <circle class="prob-ring-bg" cx="60" cy="60" r="52"/>
                        <circle id="ring-c" class="prob-ring-fill" cx="60" cy="60" r="52" stroke="#94A3B8" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
                    </svg>
                    <div class="prob-ring-text">
                        <span class="prob-value" id="prob-c">&mdash;</span>
                        <span class="prob-label" data-i18n="res_favorable"></span>
                    </div>
                </div>
            </div>
            <div class="result-divider"></div>
            <div class="result-panel">
                <div class="result-panel-title" data-i18n="res_with_cement"></div>
                <div class="prob-ring">
                    <svg viewBox="0 0 120 120">
                        <circle class="prob-ring-bg" cx="60" cy="60" r="52"/>
                        <circle id="ring-s" class="prob-ring-fill" cx="60" cy="60" r="52" stroke="#1B6B4A" stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
                    </svg>
                    <div class="prob-ring-text">
                        <span class="prob-value" id="prob-s">&mdash;</span>
                        <span class="prob-label" data-i18n="res_favorable"></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="bc" class="benefit-card positive">
            <div class="benefit-value" id="bv">&mdash;</div>
            <div class="benefit-text" id="bt"></div>
            <div class="benefit-recommendation" id="br"></div>
        </div>

        <div class="factors-card">
            <div class="card-title" data-i18n-html="res_factors_title"></div>
            <div id="fc"></div>
        </div>
    </div>

    <div class="footer">
        <div>Mart&iacute;nez-N&uacute;&ntilde;ez P, Guti&eacute;rrez-Gonz&aacute;lez R. <span data-i18n="footer_desc"></span><br>TFM &mdash; Universidad Europea &mdash; 2025/2026</div>
        <div class="footer-model">&#128208; Logistic Regression &middot; L2 (C=1.0) &middot; 10-fold CV &middot; AUC 0.655 &middot; n=482 &middot; 18 features</div>
    </div>
</div>

let LANG = 'es';

function setLang(lang) {
    LANG = lang;
    document.documentElement.lang = lang;
    document.getElementById('btn-es').className = 'lang-btn' + (lang === 'es' ? ' active' : '');
    document.getElementById('btn-en').className = 'lang-btn' + (lang === 'en' ? ' active' : '');

    const t = I[lang];

    // Plain text
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n] || '';
    });
    // HTML content
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
        el.innerHTML = t[el.dataset.i18nHtml] || '';
    });
    // Select options — preserve current value
    document.querySelectorAll('[data-i18n-opts]').forEach(sel => {
        const key = sel.dataset.i18nOpts;
        const opts = t[key];
        if (!opts) return;
        const curVal = sel.value;
        sel.innerHTML = '';
        opts.forEach(o => {
            const opt = document.createElement('option');
            opt.value = o[0];
            opt.textContent = o[1];
            if (o[2] === 'selected') opt.defaultSelected = true;
            sel.appendChild(opt);
        });
        // Restore previous selection if valid
        const validValues = opts.map(o => o[0]);
        if (validValues.includes(curVal)) {
            sel.value = curVal;
        }
    });

    // Re-run prediction if results visible
    if (document.getElementById('results').style.display !== 'none') {
        predict();
    }
}

// ===================================================================
// MODEL: Logistic Regression trained on 482 patients, 18 features
// ===================================================================
const M = {
    intercept: -0.1641071973678778,
    coef: [
        -0.07424182550938502,  // ASA
         0.04270265539595973,  // mFI
        -0.3513764472711979,   // GOLD STANDARD
        -0.2647343349661922,   // LUGAR RESIDENCIA
         0.5649605365852868,   // VA (cementación)
        -0.07995169571398107,  // MECHANISM_Low-energy
         0.10525302733704893,  // SEGMENT_Thoracic
        -0.3775987358828702,   // MECHANISM_No trauma
        -0.09432595165159663,  // ACO
         0.2642368664710965,   // PRE INDEPENDENT LIVING
         0.1250196530521116,   // UH
         0.10523441387708886,  // CALCIO
        -0.22155143452840814,  // TTO OP ANTES
         0.1943861386671186,   // OP
        -0.23903927660962226,  // MULTIPLE
        -0.19082103720451019,  // IMC
        -0.06678758458739514,  // AGE
         0.12084843101553047   // SEX
    ],
    mean: [2.4605809128630707, 1.062240663900415, 2.871369294605809, 0.13485477178423236, 0.12655601659751037, 0.6493775933609959, 0.17842323651452283, 0.24273858921161826, 0.18672199170124482, 0.19294605809128632, 78.22821576763485, 9.112098149822366, 0.26348547717842324, 0.3236514522821577, 0.7634854771784232, 26.57452353817925, 75.51452282157676, 0.26348547717842324],
    std: [0.6659330915769677, 0.9468585097661486, 0.8879377200805392, 0.34156838599503764, 0.3324749483201419, 0.477164892465568, 0.38286862653683895, 0.4287383427210255, 0.389688195248926, 0.563510073467546, 26.64835153541592, 0.764715972366155, 0.4405234165109522, 0.46786877403584864, 0.4249416469540949, 5.163270179317583, 9.656378188019568, 0.4405234165109522]
};

function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }

function predictProba(raw) {
    const sc = raw.map((v, i) => (v - M.mean[i]) / M.std[i]);
    return sigmoid(M.intercept + sc.reduce((s, v, i) => s + M.coef[i] * v, 0));
}

function getContributions(raw) {
    return raw.map((v, i) => ({
        name: I[LANG].factor_labels[i],
        c: M.coef[i] * ((v - M.mean[i]) / M.std[i])
    }));
}

function getRaw(va) {
    const mech = document.getElementById('mech').value;
    return [
        +document.getElementById('asa').value,
        +document.getElementById('mfi').value,
        +document.getElementById('gs').value,
        +document.getElementById('resi').value,
        va,
        mech === 'trauma' ? 1 : 0,
        +document.getElementById('seg').value,
        mech === 'notrauma' ? 1 : 0,
        document.getElementById('aco').checked ? 1 : 0,
        +document.getElementById('preindep').value,
        +document.getElementById('uh').value,
        +document.getElementById('calcio').value,
        document.getElementById('tto_op').checked ? 1 : 0,
        document.getElementById('op').checked ? 1 : 0,
        document.getElementById('mult').checked ? 0 : 1,
        +document.getElementById('imc').value,
        +document.getElementById('age').value,
        +document.getElementById('sex').value
    ];
}

function uv(id) {
    document.getElementById(id + '-val').textContent = document.getElementById(id).value;
}

function setRing(id, p) {
    document.getElementById(id).style.strokeDashoffset = 326.73 * (1 - p);
}

function predict() {
    const t = I[LANG];
    const pC = predictProba(getRaw(0));
    const pS = predictProba(getRaw(1));
    const benefit = pS - pC;
    const bp = (benefit * 100).toFixed(1);

    document.getElementById('results').style.display = 'block';
    document.getElementById('prob-c').textContent = (pC * 100).toFixed(1) + '%';
    document.getElementById('prob-s').textContent = (pS * 100).toFixed(1) + '%';
    setTimeout(() => { setRing('ring-c', pC); setRing('ring-s', pS); }, 100);

    const bc = document.getElementById('bc');
    document.getElementById('bv').textContent = (benefit >= 0 ? '+' : '') + bp + ' pp';

    if (benefit > 0.10) {
        bc.className = 'benefit-card positive';
        document.getElementById('bt').textContent = t.benefit_high.replace('{bp}', bp);
        document.getElementById('br').textContent = t.rec_high;
        document.getElementById('br').style.color = '#0F4A32';
    } else if (benefit > 0.03) {
        bc.className = 'benefit-card neutral';
        document.getElementById('bt').textContent = t.benefit_mod.replace('{bp}', bp);
        document.getElementById('br').textContent = t.rec_mod;
        document.getElementById('br').style.color = '#1E40AF';
    } else {
        bc.className = 'benefit-card negative';
        document.getElementById('bt').textContent = t.benefit_low.replace('{bp}', bp);
        document.getElementById('br').textContent = t.rec_low;
        document.getElementById('br').style.color = '#991B1B';
    }

    // Factor contributions (surgical scenario)
    const cs = getContributions(getRaw(1));
    cs.sort((a, b) => Math.abs(b.c) - Math.abs(a.c));
    const mx = Math.max(...cs.map(c => Math.abs(c.c)));
    const fc = document.getElementById('fc');
    fc.innerHTML = '';

    cs.forEach(c => {
        const pct = (Math.abs(c.c) / mx) * 42;
        const pos = c.c >= 0;
        fc.innerHTML += '<div class="factor-row">' +
            '<span class="factor-name">' + c.name + '</span>' +
            '<div class="factor-bar-container"><div class="factor-bar-center"></div>' +
            '<div class="factor-bar ' + (pos ? 'positive' : 'negative') + '" style="width:' + pct + '%"></div></div>' +
            '<span class="factor-impact ' + (pos ? 'pos' : 'neg') + '">' + (pos ? '+' : '') + c.c.toFixed(3) + '</span></div>';
    });

    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

setLang('es');
